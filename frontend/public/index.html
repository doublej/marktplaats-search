<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarktplaatsSearch Dashboard</title>

    <!-- CSS Import -->
    <link rel="stylesheet" href="styles.css">
</head>
<body data-theme="light">
    <!-- Header Component -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <h1 class="logo">MarktplaatsSearch</h1>
                <div class="header-actions">
                    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
                        <span id="theme-icon">🌙</span>
                    </button>
                    <div class="auth-status">
                        <div class="status-indicator" id="auth-indicator"></div>
                        <span id="auth-status-text">Not authenticated</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main">
        <div class="container">
            <!-- Authentication Section -->
            <section class="section" id="auth-section">
                <div class="section-header">
                    <h2 class="section-title">Authentication</h2>
                </div>
                <form id="auth-form">
                    <div class="form-group">
                        <label for="api-token" class="form-label">API Token</label>
                        <input
                            type="password"
                            id="api-token"
                            class="form-input"
                            placeholder="Enter your API token"
                            required
                        >
                        <div class="form-error" id="auth-error"></div>
                    </div>
                    <button type="submit" class="btn btn-primary" id="auth-submit">
                        <span class="loading" id="auth-loading" style="display: none;"></span>
                        Authenticate
                    </button>
                </form>
            </section>

            <!-- Dashboard Content (Hidden until authenticated) -->
            <div class="authenticated">
                <div class="main-layout">
                    <!-- Sidebar with searches -->
                    <aside class="sidebar">
                        <div class="sidebar-header">
                            <h3 class="sidebar-title">Searches</h3>
                            <div class="sidebar-actions">
                                <button class="btn btn-sm btn-secondary" id="refresh-searches-btn" title="Refresh all searches">↻</button>
                                <button class="btn btn-sm btn-primary" id="create-search-btn">+ New</button>
                            </div>
                        </div>
                        <div class="position-relative">
                            <div class="loading-overlay" id="searches-loading" style="display: none;">
                                <div class="loading"></div>
                            </div>
                            <div id="searches-container">
                                <div class="empty-state">
                                    <div class="empty-state-title">No searches yet</div>
                                </div>
                            </div>
                        </div>
                    </aside>

                    <!-- Main content with tabs -->
                    <main class="main-content">
                        <div class="tabs">
                            <button class="tab active" onclick="app.switchTab('results')">Results</button>
                            <button class="tab" onclick="app.switchTab('details')">Search Details</button>
                        </div>

                        <!-- Results Tab -->
                        <div id="results-tab" class="tab-panel active">
                            <div class="tab-content" id="results-content">
                                <div class="empty-state">
                                    <div class="empty-state-title">Select a search to view results</div>
                                    <p>Choose a search from the sidebar to see its results</p>
                                </div>
                            </div>
                        </div>

                        <!-- Details Tab -->
                        <div id="details-tab" class="tab-panel">
                            <div class="tab-content" id="search-details-content">
                                <div class="empty-state">
                                    <div class="empty-state-title">Select a search to view details</div>
                                    <p>Choose a search from the sidebar to edit its configuration</p>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            </div>
        </div>
    </main>

    <!-- Search Modal -->
    <div class="modal" id="search-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="search-modal-title">Create New Search</h3>
                <button class="modal-close" id="search-modal-close">&times;</button>
            </div>
            <form id="search-form">
                <div class="form-group">
                    <label for="search-query" class="form-label">Search Query *</label>
                    <input
                        type="text"
                        id="search-query"
                        class="form-input"
                        placeholder="e.g., Samsung SSD"
                        required
                    >
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="search-zip-code" class="form-label">Postal Code</label>
                        <input
                            type="text"
                            id="search-zip-code"
                            class="form-input"
                            placeholder="e.g., 1234AB"
                            pattern="[0-9]{4}[A-Z]{2}"
                        >
                    </div>
                    <div class="form-group">
                        <label for="search-distance" class="form-label">Distance (km)</label>
                        <input
                            type="number"
                            id="search-distance"
                            class="form-input"
                            min="1"
                            placeholder="e.g., 25"
                        >
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="search-price-from" class="form-label">Min Price (€)</label>
                        <input
                            type="number"
                            id="search-price-from"
                            class="form-input"
                            min="0"
                            placeholder="e.g., 50"
                        >
                    </div>
                    <div class="form-group">
                        <label for="search-price-to" class="form-label">Max Price (€)</label>
                        <input
                            type="number"
                            id="search-price-to"
                            class="form-input"
                            min="0"
                            placeholder="e.g., 500"
                        >
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="search-limit" class="form-label">Results per fetch</label>
                        <input
                            type="number"
                            id="search-limit"
                            class="form-input"
                            min="1"
                            max="100"
                            value="25"
                        >
                    </div>
                    <div class="form-group">
                        <label for="search-interval" class="form-label">Interval (minutes) *</label>
                        <input
                            type="number"
                            id="search-interval"
                            class="form-input"
                            min="1"
                            max="1440"
                            value="60"
                            required
                        >
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="search-sort-by" class="form-label">Sort by</label>
                        <select id="search-sort-by" class="form-select">
                            <option value="">Default</option>
                            <option value="date">Date</option>
                            <option value="price">Price</option>
                            <option value="distance">Distance</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="search-sort-order" class="form-label">Sort order</label>
                        <select id="search-sort-order" class="form-select">
                            <option value="">Default</option>
                            <option value="asc">Ascending</option>
                            <option value="desc">Descending</option>
                        </select>
                    </div>
                </div>

                <div class="form-error" id="search-form-error"></div>

                <div style="display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1.5rem;">
                    <button type="button" class="btn btn-secondary" id="cancel-search">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="save-search">
                        <span class="loading" id="search-save-loading" style="display: none;"></span>
                        <span id="save-search-text">Create Search</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Import -->
    <script src="app.js"></script>
</body>
</html>
